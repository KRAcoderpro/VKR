[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "tls-pineval"
version = "0.1.0"
description = "Quantitative TLS pinning security assessment for Android APKs"
authors = ["kharubnfc <kharubnfc73@gmail.com>"]
readme = "README.md"
packages = [{ include = "tls_pineval" }]

[tool.poetry.dependencies]
python = ">=3.11"
pydantic = ">=2.0"
jinja2 = ">=3.0"
click = ">=8.0"
PyYAML = ">=6.0"

# frida is NOT listed as a mandatory dependency to avoid version conflicts.
# It must be installed manually to match the frida-server version on the device.
# See docs/environment_setup.md — "Frida Setup" section.

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"

[tool.poetry.scripts]
tls-pineval = "tls_pineval.cli:cli"
